phase19_cairngorms_diagnostics:
  study:
    name: Cairngorms representation and target diagnostics
    landscape: Cairngorms Connect
    survey_year: 2023
    analysis_crs: EPSG:27700
    interpretation: retrospective method-development experiment

  frozen_inputs:
    targets_path: data/processed/phase17_cairngorms_50m_targets.parquet
    targets_sha256: 7ea4925c30ddff2445289bf2d0b892e1c146e43eeb639ca5783d34c317256b72
    lidar_metrics_path: data/raw/scotland_lidar/LiDAR_metrics_2.tif
    lidar_metrics_sha256: d9cc95fa0eb0d23a1c6d428120995f64fe4ec41fb97ebda4c1c3d7439a1f47fe
    phase18_patch_quantized_path: data/interim/phase18_cairngorms_neural/patch_quantized.npy
    phase18_patch_quantized_sha256: 23727e39e5fce08abeef10cf0e44b8a7641f42eaf0874934fc260284f44c10a6
    phase18_patch_scales_path: data/interim/phase18_cairngorms_neural/patch_scales.npy
    phase18_patch_scales_sha256: bd5f659fa066cd04a92875d4cda0ee265271c6021ca051a943a5347353ae8de4
    phase18_patch_valid_path: data/interim/phase18_cairngorms_neural/patch_valid.npy
    phase18_patch_valid_sha256: 57669e41265b54ef6f9a043df5da421802104474df2539dec48a364c5e782946
    phase18_conventional_path: data/processed/phase18_cairngorms_conventional_predictors.parquet
    phase18_conventional_sha256: 91364d1d442676f5dccf4a64e6b46d05b7ef40debaa00dc825dcda3586c6ebd0
    phase18_conventional_manifest_path: metadata/phase18_cairngorms_conventional_manifest.json
    phase18_conventional_manifest_sha256: f4ada32c9623329b844dad666bff02fe9aff8945c2428367474d7605cd3f4e5b

  lidar_profile:
    documented_lidarshm_commit: 46780613e77a94e6f2e3d13f0ae835817d426ac1
    documentation_url: https://github.com/alandhyc/lidarSHM
    source_bands:
      - lidar_vlayer_L1
      - lidar_vlayer_L2
      - lidar_vlayer_L3
    layer_labels:
      - 0_to_1m
      - 1_to_10m
      - above_10m
    minimum_total_volume: 0.000001
    entropy_name: three_layer_volume_entropy
    note: Layer-volume proportions are a documented three-stratum profile; they do not reconstruct the supplied five-bin canopy Shannon metric.

  targets:
    raw:
      - mean_canopy_shannon_50m
      - between_cell_height_sd_50m
      - mean_within_cell_height_sd_50m
      - mean_gap_fraction_50m
      - mean_height_50m
      - mean_p95_height_50m
      - mean_cover_50m
    adjusted_name: mean_canopy_shannon_50m_structurally_adjusted
    adjustment_predictors:
      - mean_height_50m
      - mean_p95_height_50m
      - mean_cover_50m
      - mean_within_cell_height_sd_50m

  tessera:
    embedding_year: 2023
    dataset_version: "1.0"
    dataset_variant: vultr
    embedding_dimensions: 128
    context_cells: [1, 3, 5, 9]
    minimum_valid_pixels:
      "1": 1
      "3": 8
      "5": 20
      "9": 65
    download_attempts: 8
    retry_delay_seconds: 20
    minimum_free_space_after_download_bytes: 536870912

  conventional:
    spatial_context_cells: 5
    chunk_rows: 3000
    minimum_valid_pixels: 20
    reuse_phase18_selected_items: true
    stac_api: https://planetarycomputer.microsoft.com/api/stac/v1
    sentinel_2:
      collection: sentinel-2-l2a
      bands:
        B02: blue
        B03: green
        B04: red
        B08: nir
        B11: swir1
        B12: swir2
      valid_scl_classes: [2, 4, 5, 6, 7]
      processing_baseline_offset_dn: 1000
      reflectance_scale: 0.0001
      minimum_valid_observations_per_point: 6
    sentinel_1:
      collection: sentinel-1-rtc
      polarizations: [vv, vh]
      minimum_valid_observations_per_point_per_state: 6
    topography:
      collection: cop-dem-glo-30
      analysis_crs: EPSG:27700
      analysis_resolution_m: 30

  spatial_evaluation:
    region_count: 5
    block_size_m: 1000
    exclusion_buffer_m: 1000
    validation_block_fraction: 0.15
    minimum_training_rows: 3000
    minimum_test_rows: 500
    seed: 20260730

  neural:
    python: /Users/ameerfiras/miniforge3/envs/rednet-ml/bin/python
    seeds: [20260730, 20260731]
    batch_size: 512
    maximum_epochs: 100
    early_stopping_patience: 12
    minimum_epochs: 12
    learning_rate: 0.001
    weight_decay: 0.0001
    dropout: 0.10
    hidden_dimensions: [256, 128]
    profile_loss_weight: 1.0

  gradient_boosting:
    learning_rate: 0.05
    max_iter: 180
    max_leaf_nodes: 31
    min_samples_leaf: 60
    l2_regularization: 10.0
    random_state: 20260730

  model_specs:
    - {name: tessera_1_single, input: tessera_1, objective: single}
    - {name: tessera_3_single, input: tessera_3, objective: single}
    - {name: tessera_5_single, input: tessera_5, objective: single}
    - {name: tessera_9_single, input: tessera_9, objective: single}
    - {name: tessera_1_multi, input: tessera_1, objective: multi}
    - {name: tessera_3_multi, input: tessera_3, objective: multi}
    - {name: tessera_5_multi, input: tessera_5, objective: multi}
    - {name: tessera_9_multi, input: tessera_9, objective: multi}
    - {name: conventional_centre_single, input: conventional_centre, objective: single}
    - {name: conventional_5_single, input: conventional_5, objective: single}
    - {name: conventional_centre_multi, input: conventional_centre, objective: multi}
    - {name: conventional_5_multi, input: conventional_5, objective: multi}
    - {name: tessera_5_profile_aux, input: tessera_5, objective: profile_aux}
    - {name: tessera_9_profile_aux, input: tessera_9, objective: profile_aux}
    - {name: conventional_5_profile_aux, input: conventional_5, objective: profile_aux}

  uncertainty:
    block_bootstrap_replicates: 1000
    seed: 20260730

  comparisons:
    - {name: fair_centre_single, candidate: tessera_1_single, reference: conventional_centre_single}
    - {name: fair_50m_single, candidate: tessera_5_single, reference: conventional_5_single}
    - {name: multitask_effect_50m, candidate: tessera_5_multi, reference: tessera_5_single}
    - {name: context_30m_vs_10m, candidate: tessera_3_single, reference: tessera_1_single}
    - {name: context_50m_vs_10m, candidate: tessera_5_single, reference: tessera_1_single}
    - {name: context_90m_vs_10m, candidate: tessera_9_single, reference: tessera_1_single}
    - {name: profile_aux_effect_50m, candidate: tessera_5_profile_aux, reference: tessera_5_single}
    - {name: profile_aux_effect_90m, candidate: tessera_9_profile_aux, reference: tessera_9_single}
    - {name: mlp_vs_hgb_tessera_50m, candidate: tessera_5_single, reference: tessera_5_hgb}
    - {name: mlp_vs_hgb_conventional_50m, candidate: conventional_5_single, reference: conventional_5_hgb}

  interpretation_gates:
    primary_target: mean_canopy_shannon_50m
    context_material_rmse_reduction_fraction: 0.05
    auxiliary_material_rmse_reduction_fraction: 0.05
    paired_interval_must_exclude_zero: true
    desired_primary_r2: 0.70
