project:
  name: tessera-gedi-fhd
  status: paper_complete_eight_site_evaluation

target:
  mission: GEDI
  product: GEDI02_B
  product_version: "003"
  cmr_collection_concept_id: C3974616135-LPCLOUD
  variable: fhd_normal
  primary_year: 2024
  footprint_diameter_m_approx: 25
  version_reason: V003_corrects_errors_affecting_fhd_and_improves_geolocation

predictors:
  source: TESSERA
  dataset_version: "1.0"
  dataset_variant: vultr
  embedding_year: 2024
  embedding_dimension: 128
  pixel_size_m_approx: 10
  never_mix_versions_or_variants: true
  selection_reason: v1.1_cambridge_has_zero_of_eight_required_tiles_v1.0_vultr_has_all_eight
  rejected_unavailable_selection: "1.1/cambridge"

sites:
  extent: neon_aop_priority_1_flight_box
  development:
    - SOAP
    - TEAK
  locked_transfer_test: BART
  aop_reference_year: 2024
  flight_boundary_source: https://www.neonscience.org/sites/default/files/AOP_flightBoxes_0.zip
  priority_1_bboxes_wgs84:
    SOAP: [-119.2919464457, 37.0142750706, -119.1767316705, 37.1042875314]
    TEAK: [-119.0962033206, 36.9514910125, -118.9715140645, 37.0427798538]
    BART: [-71.3342560121, 43.9919475560, -71.2094969977, 44.0819645961]

quality:
  require_l2b_quality_flag_rel3: 1
  require_degrade_flag: 0
  filter_missing_fhd: true
  primary_beams: full_power_from_hdf_group_metadata
  full_power_selection_rule: group_description_equals_Full_power_beam
  observed_full_power_beam_names_2024_sample: [BEAM0101, BEAM0110, BEAM1000, BEAM1011]
  sensitivity_analysis:
    - all_beams
    - nighttime_only
    - full_power_and_nighttime
    - sensitivity_at_least_0.98

forest_mask:
  source: Annual_NLCD_Collection_1_2
  year: 2024
  forest_classes: [41, 42, 43]
  minimum_footprint_forest_fraction: 0.8
  sensitivity_forest_fraction: 0.5

alignment:
  primary: area_weighted_mean_embedding_over_25m_circular_footprint
  compare_center_pixel: true
  compare_gaussian_weighting: true
  use_local_projected_crs: true
  minimum_valid_footprint_fraction: 0.95
  gaussian_sigma_m: 6.25

validation:
  prohibit_random_pixel_split: true
  within_site: buffered_spatial_block_cross_validation
  spatial_block_rule: empirical_variogram_range_rounded_up_minimum_1km
  exclusion_buffer_m: 500
  track_sensitivity_test: leave_one_orbit_track_out
  transfer: train_soap_teak_test_bart
  external_reference: neon_2024_als_simulated_gedi_fhd
  metrics:
    - r2
    - rmse
    - mae
    - spearman_r

phase3:
  development_sites: [SOAP, TEAK]
  target: fhd_normal
  feature_prefix: tessera_area_
  variogram:
    model: spherical
    bin_width_m: 250
    maximum_lag_rule: half_maximum_pair_distance_rounded_down_to_bin
    minimum_pairs_per_bin: 30
    fit_weighting: square_root_pair_count
    range_across_sites: maximum_practical_range
  folds:
    projected_crs: EPSG:5070
    block_width_rule: variogram_range_rounded_up_to_1km
    minimum_block_width_m: 1000
    grid_origin_m: [0, 0]
    number_of_folds: 5
    site_stratified: true
    assignment: greedy_with_cross_site_fold_balance
    exclusion_buffer_m: 500
  models:
    training_mean: {}
    tessera_ridge:
      scale_features_inside_training_fold: true
      alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
      tuning: nested_buffered_spatial_folds
    tessera_hist_gradient_boosting:
      tuning: fixed_initial_diagnostic
      learning_rate: 0.05
      max_iter: 300
      max_leaf_nodes: 15
      min_samples_leaf: 20
      l2_regularization: 0.1
  uncertainty:
    method: site_stratified_spatial_block_bootstrap
    replicates: 2000
    random_seed: 20260717

conventional_predictors:
  stac_api: https://planetarycomputer.microsoft.com/api/stac/v1
  year: 2024
  point_sampling: containing_pixel_at_gedi_center
  temporal_statistics: [p10, median, p90]
  sentinel_2:
    collection: sentinel-2-l2a
    bands:
      B02: blue
      B03: green
      B04: red
      B08: nir
      B11: swir1
      B12: swir2
    derived_indices: [ndvi, ndmi, nbr]
    scenes_per_month_per_mgrs_tile: 2
    maximum_item_cloud_cover_percent: 80
    valid_scl_classes: [2, 4, 5, 6, 7]
    processing_baseline_offset_dn: 1000
    reflectance_scale: 0.0001
    minimum_valid_observations_per_point: 6
  sentinel_1:
    collection: sentinel-1-rtc
    polarizations: [vv, vh]
    scenes_per_month_per_orbit_state: 2
    separate_orbit_states: true
    convert_linear_power_to_db: true
    minimum_valid_observations_per_point_per_state: 6
  topography:
    collection: cop-dem-glo-30
    source_resolution_m_approx: 30
    analysis_crs: EPSG:5070
    analysis_resolution_m: 30
    features: [elevation, slope_degrees, aspect_sin, aspect_cos]
  storage:
    stream_cloud_optimized_geotiff_windows: true
    retain_source_scenes: false

phase3_extended_experiments:
  outer_folds: spatial-folds-0b7df79521fd
  exclusion_buffer_m: 500
  ridge_alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  tune_each_feature_set_with_nested_spatial_folds: true
  feature_sets:
    terrain: [terrain_elevation_m, terrain_slope_degrees, terrain_aspect_sin, terrain_aspect_cos]
    sentinel_topography: all_conventional_predictor_features
    tessera_area: tessera_area_000_to_127
    tessera_area_topography: tessera_area_plus_terrain
    tessera_center: tessera_center_000_to_127
    tessera_gaussian: tessera_gaussian_000_to_127
  alignment_sensitivity: [center, area, gaussian]
  label_efficiency:
    model: tessera_area_ridge
    fixed_alpha_from_phase3_nested_tuning: 100.0
    training_block_fractions: [0.1, 0.25, 0.5, 1.0]
    replicates_below_full_fraction: 20
    site_stratified: true
    minimum_blocks_per_site: 1
    random_seed: 20260717
  uncertainty:
    method: site_stratified_spatial_block_bootstrap
    replicates: 2000
    random_seed: 20260717
  model_selection: deferred_until_soap_teak_transfer_results_are_frozen

phase4_development_transfer:
  directions:
    - train_site: SOAP
      test_site: TEAK
    - train_site: TEAK
      test_site: SOAP
  models:
    - training_mean
    - terrain_ridge
    - sentinel_topography_ridge
    - tessera_area_ridge
    - tessera_area_topography_ridge
    - tessera_hist_gradient_boosting
  ridge_alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  ridge_tuning: buffered_spatial_folds_within_source_site
  exclusion_buffer_m: 500
  selected_pipeline_rule:
    eligible: [tessera_area_ridge, tessera_area_topography_ridge]
    criterion: lowest_worst_direction_rmse
    practical_tie_threshold_rmse: 0.005
    tie_breaker: prefer_tessera_area_ridge
  final_combined_alpha_rule: lowest_mean_nested_validation_rmse_from_phase3_extended_tuning
  bart_predictors_may_be_built_only_after_selection_freeze: true
  bart_targets_remain_locked: true

phase4_locked_bart_evaluation:
  development_transfer_freeze_id: phase4-transfer-841220e4a99a
  bart_predictor_freeze_id: conventional-bart-b1e589a8601c
  bart_predictor_recipe_validated_equal_to_development: true
  training_sites: [SOAP, TEAK]
  locked_test_site: BART
  selected_primary_pipeline:
    model: tessera_area_topography_ridge
    alpha: 100.0
    features: area_weighted_tessera_128_plus_terrain_4
  comparison_models:
    - training_mean
    - terrain_ridge
    - sentinel_topography_ridge
    - tessera_area_ridge
    - tessera_area_topography_ridge
    - tessera_hist_gradient_boosting
  ridge_alpha_source: combined_development_alphas_in_frozen_transfer_manifest
  nonlinear_parameters_source: frozen_phase3_config
  train_on_all_development_rows: true
  tuning_or_model_selection_on_bart: prohibited
  primary_metrics: [r2, rmse, mae, spearman_r, mean_bias]
  uncertainty:
    method: bart_spatial_block_bootstrap
    spatial_block_width_m: 7000
    replicates: 2000
    random_seed: 20260717
  predictor_recipe_must_equal_development_recipe: true
  predictor_extraction_must_not_read_target: true
  target_access_allowed_only_after_predictor_freeze_validation: true
  target_access_execution: one_freeze_producing_run_after_target_free_preflight
  report_all_predeclared_models_regardless_of_result: true

