phase34_scotland_netherlands_pooled:
  study:
    name: Joint Scotland-Netherlands TESSERA v2 model
    interpretation: pooled within-landscape spatial validation with equal country influence
    support_m: 50
    source_phase: phase32_scotland_netherlands_transfer

  features:
    panel: context
    dimensions: 512

  model:
    type: ridge
    alpha: 100.0
    folds: 5
    equal_total_weight_per_country: true
    bootstrap_replicates: 2000
    bootstrap_seed: 20260821

  outputs:
    predictions: data/processed/phase34_scotland_netherlands_pooled_predictions.parquet
    metrics: outputs/tables/phase34_scotland_netherlands_pooled_metrics.csv
    comparison: outputs/tables/phase34_scotland_netherlands_pooled_comparison.csv
    bootstrap: outputs/tables/phase34_scotland_netherlands_pooled_bootstrap.csv
    figure: outputs/figures/phase34_scotland_netherlands_pooled.pdf
    report: outputs/reports/phase34_scotland_netherlands_pooled.md
    result_freeze: metadata/phase34_scotland_netherlands_pooled_result_freeze.json
