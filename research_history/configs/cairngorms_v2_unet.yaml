phase28_cairngorms_v2_unet:
  study:
    name: Final Cairngorms TESSERA v2 U-Net rerun
    lidar_year: 2023
    tessera_year: 2023
    tessera_dataset_version: experimental_v2
    analysis_crs: EPSG:27700
    interpretation: frozen within-Cairngorms spatial evaluation

  representation:
    channels: 128
    pixel_size_m: 10.0
    supplied_loader: references/tessera_v2/fetch_v2_patch_aneesh_20260811.py
    supplied_loader_sha256: f5d26913ff5f9c10dbba2ee131506997413b597149fac339c8337004604cb7a9

  frozen_inputs:
    corrected_cohort: data/processed/phase25_cairngorms_corrected_lidar_targets.parquet
    corrected_array_directory: data/interim/phase25_cairngorms_corrected_lidar
    corrected_predictions: data/processed/phase27_cairngorms_v2_predictions.parquet
    source_dense_directory: data/interim/cairngorms_dense_10m
    source_unet_directory: data/interim/phase22_cairngorms_spatial_unet
    source_v2_patch_directory: data/interim/phase27_cairngorms_v2
    source_raster: data/raw/scotland_lidar/LiDAR_metrics_2.tif

  acquisition:
    dense_directory: data/interim/phase28_cairngorms_v2_dense
    stream_directory: data/interim/phase28_cairngorms_v2_stream
    marker_directory: data/interim/phase28_cairngorms_v2_dense/tiles
    minimum_dense_coverage_fraction: 0.99
    download_attempts: 8
    retry_delay_seconds: 10
    minimum_free_space_after_download_bytes: 4294967296

  targets:
    names:
      - lidar_height_cv_50m
      - lidar_rcv_50m
      - lidar_rms_50m
      - lidar_canopy_shannon_50m
      - lidar_height_cv_50m_height_adjusted
      - lidar_rcv_50m_height_adjusted
      - lidar_rms_50m_height_adjusted
      - lidar_canopy_shannon_50m_height_adjusted
    primary: lidar_canopy_shannon_50m_height_adjusted
    confirmatory: lidar_canopy_shannon_50m
    secondary:
      - lidar_height_cv_50m
      - lidar_height_cv_50m_height_adjusted

  evaluation:
    folds: 5
    seeds: [20260804, 20260805, 20260806]
    comparison_model: tessera_v2
    bootstrap_replicates: 2000
    bootstrap_seed: 20260814
    success:
      minimum_primary_rmse_reduction_fraction: 0.05
      require_bootstrap_ci_below_zero: true

  model:
    name: tessera_v2_unet
    architecture: frozen_phase22_two_level_compact_unet
    input_channels: 129
    output_channels: 8
    base_channels: 24
    chip_cells: 128
    chip_stride_cells: 96
    minimum_training_targets_per_chip: 24
    batch_size: 2
    maximum_epochs: 50
    minimum_epochs: 10
    early_stopping_patience: 8
    learning_rate: 0.001
    weight_decay: 0.0001

  outputs:
    array_directory: data/interim/phase28_cairngorms_v2_unet
    result_directory: data/interim/phase28_cairngorms_v2_unet_results
    acquisition_manifest: metadata/phase28_cairngorms_v2_dense_acquisition.json
    preparation_status: metadata/phase28_cairngorms_v2_unet_preparation.json
    predictions: data/processed/phase28_cairngorms_v2_unet_predictions.parquet
    fold_metrics: outputs/tables/phase28_cairngorms_v2_unet_fold_metrics.csv
    macro_metrics: outputs/tables/phase28_cairngorms_v2_unet_macro.csv
    comparison: outputs/tables/phase28_cairngorms_v2_unet_comparison.csv
    figure: outputs/figures/phase28_cairngorms_v2_unet.png
    report: outputs/reports/phase28_cairngorms_v2_unet.md
    result_freeze: metadata/phase28_cairngorms_v2_unet_result_freeze.json

