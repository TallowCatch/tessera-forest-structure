name: repository checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: tessera-study demo
      - run: tessera-study verify
      - run: python -m ruff check src tests tools workflows/figure_generation workflows/sensitivity_analysis
      - run: python -m ruff format --check src tests tools workflows/figure_generation workflows/sensitivity_analysis
      - run: python -m pytest -q
